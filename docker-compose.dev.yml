services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
    volumes:
      - .:/app
    entrypoint: []
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
