services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      DATABASE_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media
    restart: unless-stopped

volumes:
  sqlite_data:
  media_data:
